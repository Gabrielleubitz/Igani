name: IganiCRM
options:
  bundleIdPrefix: co.igani
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: 8T65J68WA2
    # TwilioVoice has no x86_64 simulator slice
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
packages:
  TwilioVoice:
    url: https://github.com/twilio/twilio-voice-ios
    exactVersion: 6.13.8
targets:
  IganiCRM:
    type: application
    platform: iOS
    sources:
      - path: IganiCRM
    dependencies:
      - package: TwilioVoice
      - target: IganiNotify
        embed: true
    entitlements:
      path: IganiCRM/IganiCRM.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.communication: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.igani.crm
        PRODUCT_NAME: Igani CRM
        INFOPLIST_FILE: IganiCRM/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
  IganiNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: IganiNotify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.igani.crm.notify
        PRODUCT_NAME: IganiNotify
        INFOPLIST_FILE: IganiNotify/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
