# Igani listen relay on Fly.io: one small always-on machine near Twilio's EU edge and the team.
app = "igani-listen"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Secrets (set with `fly secrets set`, never here): LISTEN_RELAY_SECRET, TWILIO_AUTH_TOKEN, CRM_URL

[http_service]
  internal_port = 8080
  force_https = true
  # Live audio can't wait for a cold start: the machine stays up
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
